services:
  db:
    container_name: walthamdata
    image: postgis/postgis:16-3.5
    restart: always
    environment:
      POSTGRES_PASSWORD: walthamdata
      POSTGRES_DB: walthamdata
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d/
      - database_volume:/var/lib/postgresql/data
    networks:
      - waltham-gis

  mcp-gis:
    container_name: mcp-gis
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    image: mcp-gis
    ports:
      - "9000:9000"
    environment:
      POSTGRES_HOST: db:5432
    networks:
      - waltham-gis

volumes:
  database_volume:

networks:
  waltham-gis:
    name: waltham-gis